<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Jenkins Jobs Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              600: '#2563eb',
              700: '#1d4ed8',
            },
            dark: {
              800: '#1e293b',
              900: '#0f172a',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
          },
        }
      }
    }
  </script>
  <style>
  /* Dark mode specific styles */
.dark h3,
.dark p,
.dark .jobs-container,
.dark .stat-value {
  color: #cbd5e1;
}

/* Retry button styles */
.retry-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  margin-top: 1rem;
  background-color: #2563eb;
  color: white;
  border: none;
  border-radius: 0.375rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.retry-btn:hover {
  background-color: #1d4ed8;
  transform: translateY(-1px);
}

.retry-btn:active {
  transform: translateY(0);
}

.dark .retry-btn {
  background-color: #3b82f6;
}

.dark .retry-btn:hover {
  background-color: #2563eb;
}

/* Empty state styles */
.empty-state {
  text-align: center;
  padding: 2rem;
}

.empty-state-icon {
  font-size: 2rem;
  margin-bottom: 1rem;
  color: #64748b;
}

.dark .empty-state-icon {
  color: #94a3b8;
}

.empty-state-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.empty-state-description {
  color: #64748b;
  max-width: 400px;
  margin: 0 auto;
}

.dark .empty-state-title,
.dark .empty-state-description {
  color: #cbd5e1;
}
/* Error State Styles */
.empty-state {
  text-align: center;
  padding: 2rem;
  border-radius: 0.5rem;
  background-color: #f8fafc;
  margin: 1rem 0;
}

.dark .empty-state {
  background-color: #1e293b;
}

.empty-state h3 {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  color: #1e293b;
}

.dark .empty-state h3 {
  color: #e2e8f0;
}

.empty-state p {
  color: #64748b;
  margin-bottom: 1rem;
}

.dark .empty-state p {
  color: #94a3b8;
}

/* Retry Button Styles */
#retry-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background-color: #2563eb;
  color: white;
  border: none;
  border-radius: 0.375rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}
.dark td {
  color: #cbd5e1; /* Light gray text in dark mode */
}
#retry-btn:hover {
  background-color: #1d4ed8;
  transform: translateY(-1px);
}

#retry-btn:active {
  transform: translateY(0);
}

.dark #retry-btn {
  background-color: #3b82f6;
}

.dark #retry-btn:hover {
  background-color: #2563eb;
}

/* Icon styling */
#retry-btn i {
  margin-right: 0.5rem;
}
  </style>
  <link rel="stylesheet" href="assets/css/jenkins_dashboard.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
  <div class="dashboard-container">

    <div class="dashboard-header">
      <h1 class="dashboard-title">
        <i class="fa-brands fa-jenkins"></i>
        <span>Jenkins Jobs Dashboard</span>
      </h1>
      <button id="refresh-btn" class="refresh-btn">
        <i class="fas fa-sync-alt icon"></i>
        <i class="fas fa-spinner spinner"></i>
        <span>Refresh</span>
      </button>
    </div>

    <div class="dashboard-container">
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-title">Total Jobs</div>
          <div class="stat-value" id="total-jobs">0</div>
          <div class="stat-change positive">
            <i class="fas fa-arrow-up"></i>
            <span>2 from last week</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Success Rate</div>
          <div class="stat-value" id="success-rate">0%</div>
          <div class="stat-change negative">
            <i class="fas fa-arrow-down"></i>
            <span>5% from last week</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Currently Building</div>
          <div class="stat-value" id="building-jobs">0</div>
          <div class="stat-change positive">
            <i class="fas fa-arrow-up"></i>
            <span>1 from yesterday</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Average Duration</div>
          <div class="stat-value" id="avg-duration">0m</div>
          <div class="stat-change positive">
            <i class="fas fa-arrow-down"></i>
            <span>2m faster</span>
          </div>
        </div>
      </div>
    </div>

    <div class="jobs-table-container">
      <div id="jobs-container">
        <div class="empty-state">
          <div class="empty-state-icon">
            <i class="fas fa-spinner fa-spin"></i>
          </div>
          <h3 class="empty-state-title">Loading Jobs...</h3>
          <p class="empty-state-description">Please wait while we fetch the latest job information from Jenkins</p>
        </div>
      </div>
    </div>
  </div>


  <script src="assets/js/jenkins_dashboard.js"></script>

</body>
</html>
