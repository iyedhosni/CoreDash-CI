<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Account Settings • 3S Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
            },
            dark: {
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' }, },
            slideUp: { '0%': { transform: 'translateY(10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' }, },
          },
        }
      }
    }
  </script>
  <style>
    :root { --transition-speed: 0.3s; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: transparent !important;
      color: #1e293b;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
      padding: 1rem;
    }
    body.dark {
      color: #e2e8f0;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 4px; }
    body.dark ::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); }
    .toggle-checkbox:checked + .toggle-label { background-color: #2563eb; }
    .toggle-checkbox:checked + .toggle-label::after { transform: translateX(100%); }
    .toggle-label::after { content: ''; position: absolute; left: 2px; top: 2px; width: 1.75rem; height: 1.75rem; background-color: white; border-radius: 9999px; transition: transform 0.2s ease-in-out; }
    .toggle-label { display: inline-block; width: 3.5rem; height: 2rem; background-color: #cbd5e1; border-radius: 9999px; position: relative; cursor: pointer; transition: background-color 0.2s ease-in-out; }
    body.dark .toggle-label { background-color: #4a5568; } 
  </style>
</head>
<body class="h-full">
  <script>
    window.parent.postMessage('settingsLoaded', '*');
    window.addEventListener('message', (event) => {
      if (event.data === 'closeSettings') {}
    });
    function notifySettingsSaved() {
      window.parent.postMessage('settingsSaved', '*');
    }
    function applyTheme() {
      const savedTheme = localStorage.getItem('theme') || (window.parent && window.parent.document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
        document.body.classList.remove('dark');
      }
    }
    applyTheme();
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'themeChange') {
            if (event.data.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
            }
        }
    });
  </script>

  <div class="container  py-4 h-full overflow-y-auto" style="display: flex;">
    <!-- Change Password Card -->
    <div class="bg-white dark:bg-dark-800 rounded-lg p-6 mb-6 animate-fade-in" style="border: inset; width: 56rem; height: max-content; margin: 10px;">
      <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">Change Password</h2>
      <form id="change-password-form">
        <div id="change-password-message-area" class="mb-4"></div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="currentPassword">Current Password</label>
          <div class="relative rounded-md shadow-sm">
            <input type="password" id="currentPassword" name="currentPassword" placeholder="••••••••" required 
                   class="mt-1 block w-full px-3 py-2 bg-white dark:bg-dark-700 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm text-gray-900 dark:text-gray-100">
            <button type="button" class="password-toggle absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">
              <i class="far fa-eye text-gray-500 dark:text-gray-400"></i>
            </button>
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="newPassword">New Password</label>
          <div class="relative rounded-md shadow-sm">
            <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" required
                   class="mt-1 block w-full px-3 py-2 bg-white dark:bg-dark-700 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm text-gray-900 dark:text-gray-100">
            <button type="button" class="password-toggle absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">
              <i class="far fa-eye text-gray-500 dark:text-gray-400"></i>
            </button>
          </div>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="confirmNewPassword">Confirm New Password</label>
          <div class="relative rounded-md shadow-sm">
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="••••••••" required
                   class="mt-1 block w-full px-3 py-2 bg-white dark:bg-dark-700 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm text-gray-900 dark:text-gray-100">
            <button type="button" class="password-toggle absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">
              <i class="far fa-eye text-gray-500 dark:text-gray-400"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full sm:w-auto inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 dark:focus:ring-offset-dark-800">
          Save Changes
        </button>
      </form>
    </div>

    <!-- Email Two-Factor Authentication Card -->
    <div class="bg-white dark:bg-dark-800 rounded-lg p-6 mb-6 animate-fade-in" style="animation-delay: 0.1s; border: inset; width: 56rem; height: max-content;" >
      <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">Email Two-Factor Authentication (2FA)</h2>
      <div id="2fa-message-area" class="mb-4"></div>
      
      <div class="flex items-center mb-4">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" id="email-2fa-toggle" class="sr-only toggle-checkbox">
          <span class="toggle-label"></span>
          <span class="ml-3 text-gray-700 dark:text-gray-300 font-medium" id="email-2fa-status-label">
            Enable Email 2FA
          </span>
        </label>
      </div>

      <div id="2fa-verification-section" style="display: none;" class="mt-4 p-4 border border-gray-200 dark:border-gray-700 rounded-md bg-gray-50 dark:bg-dark-700">
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">A verification code has been sent to your email. Please enter it below to enable 2FA.</p>
        <div class="mb-3">
          <label for="2fa-verification-code" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Verification Code</label>
          <input type="text" id="2fa-verification-code" placeholder="Enter code"
                 class="mt-1 block w-full px-3 py-2 bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm text-gray-900 dark:text-gray-100">
        </div>
        <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-2">
          <button id="verify-2fa-code-btn" class="w-full sm:w-auto inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 dark:focus:ring-offset-dark-700">
            Verify & Enable
          </button>
          <button id="cancel-2fa-setup-btn" class="w-full sm:w-auto inline-flex justify-center py-2 px-4 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-dark-800 hover:bg-gray-50 dark:hover:bg-dark-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 dark:focus:ring-offset-dark-700">
            Cancel
          </button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="assets/js/settings.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordToggles = document.querySelectorAll('.password-toggle');
      passwordToggles.forEach(toggle => {
        toggle.addEventListener('click', function (event) {
          event.preventDefault(); // Prevent form submission if inside form
          const inputField = this.previousElementSibling;
          const icon = this.querySelector('i');
          if (inputField.type === 'password') {
            inputField.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
          } else {
            inputField.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
          }
        });
      });
      // The 2FA toggle input ID is already 'email-2fa-toggle', which settings.js expects.
      // The visual part is handled by the label and span.toggle-label with CSS.
    });
  </script>
</body>
</html>
